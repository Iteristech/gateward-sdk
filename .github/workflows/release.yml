name: release

# Al pushear un tag `vX.Y.Z`: crea el GitHub Release con el tarball instalable
# y, si hay NPM_TOKEN, publica en npm. La versión del tag debe coincidir con la
# de package.json — el job falla si no, antes de publicar nada.
on:
  push:
    tags: ["v*.*.*"]

# Un run por tag; nunca se cancela una publicación en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # sbk-small: sin Docker. El provenance OIDC no depende del runner.
    runs-on: [self-hosted, sbk-small]
    timeout-minutes: 15
    permissions:
      # Crear el GitHub Release y subir el tarball.
      contents: write
      # Requerido para el provenance de npm (attestation firmada por OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          cache: false
      # Runner efímero: un cache solo subiría a GitHub en cada run; queda apagado.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Tag y package.json deben coincidir
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG" >&2
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Tarball y GitHub Release
        run: |
          pnpm pack
          gh release create "$GITHUB_REF_NAME" gateward-sdk-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # Sin NPM_TOKEN (org de npm pendiente, DIST-001) solo sale el tarball.
      - name: Publicar en npm
        if: env.NODE_AUTH_TOKEN != ''
        run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
